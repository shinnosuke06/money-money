<body class="bg-gray-50 text-gray-800 font-sans pb-24">
    <div id="app"></div>

    <script>
        // ----------------------------------------------------
        // アプリケーションの全ロジック
        // ----------------------------------------------------
        const STORAGE_KEY = 'mpm_vanilla_v9_'; 

        const escapeHTML = (str) => {
            return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        };

        const CAT_LABELS = {
            'loan': { label: 'ローン', icon: 'home', color: 'text-purple-600', bg: 'bg-purple-400', border: 'border-purple-200' },
            'fixed': { label: '固定費', icon: 'receipt_long', color: 'text-indigo-600', bg: 'bg-indigo-400', border: 'border-indigo-200' },
            'variable': { label: '変動費', icon: 'credit_card', color: 'text-rose-600', bg: 'bg-rose-400', border: 'border-rose-200' },
            'investment': { label: '投資', icon: 'trending_up', color: 'text-emerald-600', bg: 'bg-emerald-400', border: 'border-emerald-200' }
        };
        const SAFE_CAT = { label: '未分類', icon: 'payments', color: 'text-gray-600', bg: 'bg-gray-400', border: 'border-gray-200' };

        const ITEM_COLORS = [
            'bg-red-400', 'bg-orange-400', 'bg-amber-400', 'bg-yellow-400', 'bg-lime-400',
            'bg-green-400', 'bg-emerald-400', 'bg-teal-400', 'bg-cyan-400', 'bg-sky-400',
            'bg-blue-400', 'bg-indigo-400', 'bg-violet-400', 'bg-purple-400', 'bg-fuchsia-400',
            'bg-pink-400', 'bg-rose-400'
        ];

        const ICON_MAP = {
            'wallet': 'account_balance_wallet', 'arrow-down-to-line': 'vertical_align_bottom',
            'arrow-up-from-line': 'vertical_align_top', 'alert-circle': 'error_outline',
            'check-circle-2': 'check_circle', 'calculator': 'calculate', 'calendar': 'calendar_today',
            'chevron-down': 'expand_more', 'chevron-up': 'expand_less', 'bar-chart-3': 'bar_chart',
            'layout-dashboard': 'dashboard', 'save': 'save', 'info': 'info', 'building-2': 'account_balance',
            'alert-triangle': 'warning', 'x': 'close', 'settings': 'settings', 'copy': 'content_copy',
            'download': 'download', 'upload': 'upload', 'file-text': 'description', 'check': 'check',
            'plus': 'add', 'trash-2': 'delete', 'pencil': 'edit', 'message-square': 'chat_bubble_outline',
            'done': 'done_all', 'undo': 'undo', 'refresh': 'refresh', 'payments': 'payments',
            'home': 'home', 'receipt_long': 'receipt_long', 'credit_card': 'credit_card', 'trending_up': 'trending_up',
            'error_outline': 'error_outline', 'savings': 'savings', 'event_note': 'event_note',
            'auto_awesome': 'auto_awesome', 'trending_flat': 'trending_flat'
        };

        const App = {
            state: {
                activeTab: 'dashboard', dashTab: 'accounts', chartMode: 'all',
                accounts: [], wallets: [], incomes: [], payments: [], history: [], specialPayments: [], memos: [],
                expandedPayIds: new Set(), editMode: null, deleteTarget: null, selectedAccountPopup: null, preSaveModal: null, showAutoSaveModal: false,
                confirmImportData: null, showSuccessModal: false, showBackupErrorModal: false, allocationReportModal: null,
                exportData: '', importData: '', importMsg: { text: '', isError: false }, copySuccess: false,
                saveMonthStr: '', manualHistoryMonth: '', selectedHistoryId: null, historyEditMode: null, tempHistoryEditData: null,
                allocationEditModal: null,
            },

            getIconHTML: function(name, size = 24, className = '') {
                const mappedName = ICON_MAP[name] || name;
                return `<span class="material-symbols-outlined ${className}" style="font-size: ${size}px; line-height: 1; display: inline-flex; align-items: center; justify-content: center;">${mappedName}</span>`;
            },

            getColorForName: function(name) {
                if (!name) return 'bg-gray-400';
                let hash = 0;
                for (let i = 0; i < name.length; i++) { hash = name.charCodeAt(i) + ((hash << 5) - hash); }
                hash = Math.abs(hash); return ITEM_COLORS[hash % ITEM_COLORS.length];
            },

            calcAmount: function(str) {
                if (str === null || str === undefined || str === '') return 0;
                if (typeof str === 'number') return str;
                try {
                    let sanitized = str.toString().replace(/[０-９＋－＊／．]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/\s+/g, '').replace(/[^0-9+\-*/.]/g, '');
                    if (!sanitized) return 0;
                    const tokens = sanitized.match(/[+\-*/]|[^+\-*/]+/g); if (!tokens) return 0;
                    let stack = [], currentOp = '+';
                    for (let i = 0; i < tokens.length; i++) {
                        const token = tokens[i];
                        if (['+', '-', '*', '/'].includes(token)) { currentOp = token; } 
                        else {
                            let num = parseFloat(token) || 0;
                            if (currentOp === '+') stack.push(num); else if (currentOp === '-') stack.push(-num); else if (currentOp === '*') stack.push((stack.pop() || 0) * num); else if (currentOp === '/') stack.push(num !== 0 ? (stack.pop() || 0) / num : 0);
                        }
                    }
                    return Math.floor(stack.reduce((sum, val) => sum + val, 0));
                } catch (e) { return 0; }
            },

            formatCurrency: function(amountStr) {
                const num = App.calcAmount(amountStr);
                return new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY' }).format(num);
            },

            getDisplayAmountHTML: function(str, className = "") {
                const num = App.calcAmount(str);
                const strVal = String(str || '');
                const hasMath = /[+\-*/]/.test(strVal.replace(/[＋－＊／]/g, '+'));
                return `<div class="flex flex-col items-end ${className}"><span class="font-bold">${App.formatCurrency(num)}</span>${hasMath ? `<span class="text-[10px] text-gray-400 font-mono -mt-1 tracking-tighter">(${escapeHTML(str)})</span>` : ''}</div>`;
            },

            getCurrentMonthStr: function() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; },
            getPreviousMonthStr: function() { const d = new Date(); d.setMonth(d.getMonth() - 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; },
            cleanInput: function(val) { return String(val || '').replace(/,/g, ''); },

            getNiceMax: function(val) {
                if (val <= 0) return 40000;
                const pow = Math.pow(10, Math.floor(Math.log10(val)));
                const frac = val / pow;
                let niceFrac;
                if (frac <= 1) niceFrac = 1; else if (frac <= 1.2) niceFrac = 1.2; else if (frac <= 1.6) niceFrac = 1.6;
                else if (frac <= 2) niceFrac = 2; else if (frac <= 4) niceFrac = 4; else if (frac <= 6) niceFrac = 6;
                else if (frac <= 8) niceFrac = 8; else niceFrac = 10;
                return niceFrac * pow;
            },

            safeLoadArray: function(keys) {
                for (let key of keys) {
                    try { const data = localStorage.getItem(key); if (data) { const parsed = JSON.parse(data); if (Array.isArray(parsed)) return parsed; } } catch(e) {}
                }
                return [];
            },

            loadData: function() {
                App.state.accounts = App.safeLoadArray([STORAGE_KEY + 'accounts', 'mpm_vanilla_v8_accounts', 'mpm_vanilla_v7_accounts']);
                App.state.wallets = App.safeLoadArray([STORAGE_KEY + 'wallets', 'mpm_vanilla_v8_wallets', 'mpm_vanilla_v7_wallets']);
                App.state.incomes = App.safeLoadArray([STORAGE_KEY + 'incomes', 'mpm_vanilla_v8_incomes', 'mpm_vanilla_v7_incomes']);
                App.state.payments = App.safeLoadArray([STORAGE_KEY + 'payments', 'mpm_vanilla_v8_payments', 'mpm_vanilla_v7_payments']).map(p => ({
                    ...p, category: p.category || (p.isFixed ? 'fixed' : 'variable'), 
                    subItems: (Array.isArray(p.subItems) ? p.subItems : []).map(s => ({...s, category: s.category || (s.isFixed ? 'fixed' : 'variable')}))
                }));
                App.state.history = App.safeLoadArray([STORAGE_KEY + 'history', 'mpm_vanilla_v8_history']);
                App.state.specialPayments = App.safeLoadArray([STORAGE_KEY + 'specialPayments', 'mpm_vanilla_v8_specialPayments']);
                App.state.memos = App.safeLoadArray([STORAGE_KEY + 'memos', 'mpm_vanilla_v8_memos']);
                App.state.saveMonthStr = App.getCurrentMonthStr();
                App.state.manualHistoryMonth = App.getPreviousMonthStr();
            },

            saveData: function() {
                localStorage.setItem(STORAGE_KEY + 'accounts', JSON.stringify(App.state.accounts));
                localStorage.setItem(STORAGE_KEY + 'wallets', JSON.stringify(App.state.wallets));
                localStorage.setItem(STORAGE_KEY + 'incomes', JSON.stringify(App.state.incomes));
                localStorage.setItem(STORAGE_KEY + 'payments', JSON.stringify(App.state.payments));
                localStorage.setItem(STORAGE_KEY + 'history', JSON.stringify(App.state.history));
                localStorage.setItem(STORAGE_KEY + 'specialPayments', JSON.stringify(App.state.specialPayments));
                localStorage.setItem(STORAGE_KEY + 'memos', JSON.stringify(App.state.memos));
            },

            totals: {},
            calculateTotals: function() {
                const s = App.state;
                let totalAccountsNum = 0, totalWalletsNum = 0, activeAccountIncomes = 0, totalAccountIncomes = 0;
                let activeWalletsOutgo = 0, activeIncomesList = 0, totalIncomesList = 0, activePayments = 0, totalPaymentsNum = 0;
                let totalActiveIncomes = 0, totalAllocated = 0;
                const catTotals = { loan: 0, fixed: 0, variable: 0, investment: 0 }, allCatTotals = { loan: 0, fixed: 0, variable: 0, investment: 0 };

                s.accounts.forEach(a => {
                    totalAccountsNum += App.calcAmount(a.amount); const inc = App.calcAmount(a.incomingAmount); totalAccountIncomes += inc;
                    if (!a.isIncomingDone) { activeAccountIncomes += inc; totalAllocated += inc; }
                });
                s.wallets.forEach(w => {
                    totalWalletsNum += App.calcAmount(w.amount); if (!w.isOutgoDone) activeWalletsOutgo += App.calcAmount(w.outgoAmount);
                    const wInc = App.calcAmount(w.incomingAmount); if (!w.isIncomingDone) totalAllocated += wInc;
                });
                s.incomes.forEach(i => {
                    const amt = App.calcAmount(i.amount); totalIncomesList += amt;
                    if (!i.isDone) { activeIncomesList += amt; totalActiveIncomes += amt; }
                });
                s.payments.forEach(p => {
                    const pAmt = App.calcAmount(p.amount); totalPaymentsNum += pAmt; if (!p.isDone) activePayments += pAmt;
                    let subTotal = 0;
                    if (p.subItems && p.subItems.length > 0) {
                        p.subItems.forEach(sub => {
                            const sAmt = App.calcAmount(sub.amount); subTotal += sAmt; const sCat = sub.category || 'variable';
                            if (!p.isDone && catTotals[sCat] !== undefined) catTotals[sCat] += sAmt;
                            if (allCatTotals[sCat] !== undefined) allCatTotals[sCat] += sAmt;
                        });
                    }
                    const diff = pAmt - subTotal;
                    if (diff > 0) {
                        const pCat = p.category || 'variable';
                        if (!p.isDone && catTotals[pCat] !== undefined) catTotals[pCat] += diff;
                        if (allCatTotals[pCat] !== undefined) allCatTotals[pCat] += diff;
                    }
                });

                const currentMonth = App.getCurrentMonthStr();
                let currentMonthSpecialAmt = 0, totalSpecialAmt = 0, totalMonthlyRequired = 0; 
                let upcomingSpecials = [];
                const curDate = new Date(), curY = curDate.getFullYear(), curM = curDate.getMonth() + 1;

                s.specialPayments.forEach(sp => {
                    if (!sp.isDone) {
                        const amt = App.calcAmount(sp.amount); totalSpecialAmt += amt;
                        if (sp.targetMonth === currentMonth) { currentMonthSpecialAmt += amt; activePayments += amt; }
                        if (sp.targetMonth) {
                            const [ty, tm] = sp.targetMonth.split('-');
                            let monthsLeft = (parseInt(ty) - curY) * 12 + (parseInt(tm) - curM) + 1;
                            if (monthsLeft < 1) monthsLeft = 1;
                            upcomingSpecials.push({ amount: amt, monthsLeft: monthsLeft });
                        }
                    }
                });

                upcomingSpecials.sort((a, b) => a.monthsLeft - b.monthsLeft);
                let cumulativeAmt = 0;
                upcomingSpecials.forEach(sp => {
                    cumulativeAmt += sp.amount;
                    const required = Math.ceil(cumulativeAmt / sp.monthsLeft);
                    if (required > totalMonthlyRequired) totalMonthlyRequired = required;
                });

                const remainingIncomes = Math.max(0, activeIncomesList - activeAccountIncomes);
                const activeFinalBalance = totalAccountsNum + totalWalletsNum + activeAccountIncomes + remainingIncomes - activePayments - activeWalletsOutgo;
                const calculatedEndBalance = totalAccountsNum + totalWalletsNum;
                const unallocatedAmount = totalActiveIncomes - totalAllocated;

                App.totals = { 
                    totalAccountsNum, totalWalletsNum, activeAccountIncomes, totalAccountIncomes, activeWalletsOutgo, activeIncomesList, totalIncomesList, remainingIncomes, 
                    activePayments, totalPaymentsNum, catTotals, allCatTotals, activeFinalBalance, calculatedEndBalance,
                    totalSpecialAmt, totalMonthlyRequired, currentMonthSpecialAmt, totalActiveIncomes, totalAllocated, unallocatedAmount
                };
            },

            executeAutoAllocation: function() {
                if (!window.confirm('現在の各口座の入金予定額をリセットし、収入予定額から不足分を自動で割り振ります。よろしいですか？\n※ご自身で手入力した入金予定額は上書きされます。')) return;

                const s = App.state;
                s.accounts.forEach(a => a.incomingAmount = ''); s.wallets.forEach(w => w.incomingAmount = ''); 
                
                let allocMap = {}; 
                const addAlloc = (id, amt) => { if (!allocMap[id]) allocMap[id] = []; if (amt !== 0) allocMap[id].push(amt.toString()); };

                let reportLines = [];
                let incomePool = []; // 入金原資のプール

                // Step 1: プールの作成と直接入金指定分の処理
                s.incomes.forEach(inc => {
                    if (!inc.isDone) {
                        const amt = App.calcAmount(inc.amount);
                        inc.autoAllocations = []; // 割当記録をリセット
                        if (inc.targetId) {
                            let tName = '不明';
                            if(inc.targetId.startsWith('acc_')) { const t = s.accounts.find(a=>a.id == inc.targetId.split('_')[1]); if(t) tName = t.name; }
                            if(inc.targetId.startsWith('wal_')) { const t = s.wallets.find(w=>w.id == inc.targetId.split('_')[1]); if(t) tName = w.name; }
                            inc.autoAllocations.push({ targetId: inc.targetId, name: tName, amount: amt }); // 直接指定分も記録
                            addAlloc(inc.targetId, amt);
                        } else {
                            incomePool.push({ ref: inc, remain: amt });
                        }
                    }
                });

                // プールから資金を引き出す関数
                const allocateFromPool = (targetId, targetName, amount) => {
                    let needed = amount;
                    for (let i = 0; i < incomePool.length && needed > 0; i++) {
                        let pool = incomePool[i];
                        if (pool.remain > 0) {
                            let take = Math.min(pool.remain, needed);
                            pool.remain -= take;
                            needed -= take;
                            pool.ref.autoAllocations.push({ targetId: targetId, name: targetName, amount: take }); // どこへ移動したかを記憶
                        }
                    }
                    addAlloc(targetId, amount); // 物理的に口座にセット
                };

                // Step 2: 引落しのカバー
                    const curAlloc = (allocMap[id] || []).reduce((sum, v) => sum + App.calcAmount(v), 0);
                    const totalPay = s.payments.filter(p => p.accountId === a.id && !p.isDone).reduce((sum, p) => sum + App.calcAmount(p.amount), 0);
                    
                    const expected = curAmt + curAlloc - totalPay;
                    if (expected < 0) { 
                        let shortage = Math.abs(expected);
                        let roundedShortage = Math.ceil(shortage / 1000) * 1000;
                        allocateFromPool(id, a.name, roundedShortage); 
                        const finalExpected = curAmt + curAlloc + roundedShortage - totalPay;
                        reportLines.push(`✅ 【${escapeHTML(a.name)}】<br>不足額 ${App.formatCurrency(shortage)} ➡️ <strong>${App.formatCurrency(roundedShortage)}</strong> を補填割当<br><span class="text-emerald-700 font-bold">（引落後予想: ${App.formatCurrency(finalExpected)} のプラス）</span>`);
                    }
                });

                s.wallets.forEach(w => {
                    const id = 'wal_' + w.id; const curAmt = App.calcAmount(w.amount);
                    const curAlloc = (allocMap[id] || []).reduce((sum, v) => sum + App.calcAmount(v), 0);
                    const totalOut = w.isOutgoDone ? 0 : App.calcAmount(w.outgoAmount);
                    
                    const expected = curAmt + curAlloc - totalOut;
                    if (expected < 0) { 
                        let shortage = Math.abs(expected);
                        let roundedShortage = Math.ceil(shortage / 1000) * 1000;
                        allocateFromPool(id, w.name, roundedShortage);
                        const finalExpected = curAmt + curAlloc + roundedShortage - totalOut;
                        reportLines.push(`✅ 【${escapeHTML(w.name)}】<br>不足額 ${App.formatCurrency(shortage)} ➡️ <strong>${App.formatCurrency(roundedShortage)}</strong> を補填割当<br><span class="text-emerald-700 font-bold">（消費後予想: ${App.formatCurrency(finalExpected)} のプラス）</span>`);
                    }
                });

                s.accounts.forEach(a => { const fa = App.calcAmount(a.fixedAllocation); if (fa > 0) { allocateFromPool('acc_' + a.id, a.name, fa); reportLines.push(`📌 【${escapeHTML(a.name)}】<br>固定ルールにより <strong>${App.formatCurrency(fa)}</strong> を割当`); } });
                s.wallets.forEach(w => { const fa = App.calcAmount(w.fixedAllocation); if (fa > 0) { allocateFromPool('wal_' + w.id, w.name, fa); reportLines.push(`📌 【${escapeHTML(w.name)}】<br>固定ルールにより <strong>${App.formatCurrency(fa)}</strong> を割当`); } });

                let surplus = incomePool.reduce((sum, pool) => sum + pool.remain, 0);
                if (surplus > 0) {
                    let targetAcc = s.accounts.find(a => a.isSurplusDest) || s.accounts.find(a => a.name.includes('三井住友 鳳')) || s.accounts.find(a => a.name.includes('JA')) || s.accounts.find(a => a.name.includes('大阪信用金庫'));
                    if (targetAcc) {
                        allocateFromPool('acc_' + targetAcc.id, targetAcc.name, surplus);
                        reportLines.push(`🌟 【${escapeHTML(targetAcc.name)}】<br>余剰金 <strong>${App.formatCurrency(surplus)}</strong> を優先的に全額割り当てました`);
                    }
                }
            closeModal: function(modalName) { 
                App.state[modalName] = null; 
                if (modalName === 'showAutoSaveModal') App.state.showAutoSaveModal = false; 
                if (modalName === 'showSuccessModal') App.state.showSuccessModal = false; 
                if (modalName === 'showBackupErrorModal') App.state.showBackupErrorModal = false;
                if (modalName === 'allocationReportModal') App.state.allocationReportModal = null;
                if (modalName === 'allocationEditModal') App.state.allocationEditModal = null;
                App.render(); 
            },
            openAccountPopup: function(id) { App.state.selectedAccountPopup = id; App.render(); },
            
            // ★ 振り分け指示の個別編集・反映機能
            openAllocationEditModal: function(incomeId, allocIndex) {
                const income = App.state.incomes.find(i => i.id === incomeId);
                if (income && income.autoAllocations && income.autoAllocations[allocIndex]) {
                    const alloc = income.autoAllocations[allocIndex];
                    App.state.allocationEditModal = { incomeId, allocIndex, targetId: alloc.targetId, name: alloc.name, amount: alloc.amount };
                    App.render();
                }
            },
            saveAllocationEdit: function(e) {
                e.preventDefault();
                const modal = App.state.allocationEditModal; if (!modal) return;
                const newAmount = App.calcAmount(document.getElementById('edit-alloc-amount').value);
                const diff = newAmount - modal.amount;
                
                const s = App.state; const income = s.incomes.find(i => i.id === modal.incomeId);
                if (income) income.autoAllocations[modal.allocIndex].amount = newAmount;
                
                let targetId = modal.targetId;
                if (!targetId) { // 古いデータ用のフォールバック
                    const acc = s.accounts.find(a => a.name === modal.name); if(acc) targetId = 'acc_' + acc.id;
                    else { const wal = s.wallets.find(w => w.name === modal.name); if(wal) targetId = 'wal_' + wal.id; }
                }
                
                // 口座・現金の入金予定額にも差額を反映（単一の綺麗な数値に再計算する）
                if (targetId && diff !== 0) {
                    let targetList = targetId.startsWith('acc_') ? s.accounts : s.wallets;
                    let idNum = Number(targetId.split('_')[1]);
                    let targetItem = targetList.find(item => item.id === idNum);
                    if (targetItem) {
                        let current = App.calcAmount(targetItem.incomingAmount);
                        targetItem.incomingAmount = String(current + diff);
                    }
                }
                App.state.allocationEditModal = null; App.saveData(); App.render();
            },
            deleteAllocation: function() {
                const modal = App.state.allocationEditModal; if (!modal) return;
                if (!window.confirm('この振り分け指示を削除しますか？\n（対象の口座の入金予定額からも差し引かれます）')) return;
                const diff = -modal.amount; // 削除時は全額マイナスする
                
                const s = App.state; const income = s.incomes.find(i => i.id === modal.incomeId);
                if (income) income.autoAllocations.splice(modal.allocIndex, 1);
                
                let targetId = modal.targetId;
                if (!targetId) {
                    const acc = s.accounts.find(a => a.name === modal.name); if(acc) targetId = 'acc_' + acc.id;
                    else { const wal = s.wallets.find(w => w.name === modal.name); if(wal) targetId = 'wal_' + wal.id; }
                }
                if (targetId && diff !== 0) {
                    let targetList = targetId.startsWith('acc_') ? s.accounts : s.wallets;

            safeMemo: function(memo) { return String(memo || '').replace(/,/g, '，').replace(/\n/g, ' '); },

                txt += "\n【特別支出】\n";

            handleGenerateExport: function() { try { App.state.exportData = App.generateExportText(); App.state.copySuccess = false; App.state.importMsg = { text: '', isError: false }; App.render(); } catch (e) { App.state.importMsg = { text: '出力エラー', isError: true }; App.render(); } },
            handleDownloadExport: function() { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([App.generateExportText()], { type: 'text/plain' })); const d = new Date(); a.download = `payment_backup_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.txt`; document.body.appendChild(a); a.click(); document.body.removeChild(a); } catch (e) { alert('ファイル保存に失敗しました。'); } },
            handleCopy: function() { const fb = () => { const ta = document.createElement("textarea"); ta.value = App.state.exportData; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); App.state.copySuccess = true; App.render(); setTimeout(() => {App.state.copySuccess = false; App.render();}, 3000); } catch (err) {} document.body.removeChild(ta); }; if (!App.state.exportData) return; if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(App.state.exportData).then(() => { App.state.copySuccess = true; App.render(); setTimeout(() => {App.state.copySuccess = false; App.render();}, 3000); }).catch(fb); } else { fb(); } },
            handleFileUpload: function(input) { const file = input.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (ev) => { App.state.importData = ev.target.result; App.state.importMsg = { text: 'ファイルを読み込みました。「復元を実行」を押してください。', isError: false }; App.render(); }; reader.readAsText(file); input.value = null; },
            handleImportClick: function() {
                const text = document.getElementById('import-data-text').value; if (!text || !text.trim()) { App.state.importMsg = { text: 'データを入力するかファイルを選択してください。', isError: true }; App.render(); return; }
                try {
                    const lines = text.replace(/，/g, ',').replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).split('\n'); let mode = ''; const nA = [], nW = [], nI = [], nP = [], nH = [], nSP = [], nM = []; let currP = null;
                    for(let i=0; i<lines.length; i++) {
                        let line = lines[i].trim(); if (!line || line.startsWith('---')) continue; if (line.startsWith('【')) { mode = line; continue; }
                        const pts = line.split(',');
                        if (mode === '【口座】' && pts.length >= 3) { let incAmt = '', isIncDone = false, memo = '', fa = '', isSurplus = false; if (pts.length === 4) memo = pts[3]; else if (pts.length === 5) { incAmt = pts[3]; memo = pts[4]; } else if (pts.length === 6) { incAmt = pts[3]; isIncDone = pts[4]==='1'; memo = pts[5]; } else if (pts.length === 7) { incAmt = pts[3]; isIncDone = pts[4]==='1'; memo = pts[5]; fa = pts[6]; } else if (pts.length >= 8) { incAmt = pts[3]; isIncDone = pts[4]==='1'; memo = pts[5]; fa = pts[6]; isSurplus = pts[7]==='1'; } nA.push({ id: Number(pts[0]), name: pts[1], amount: pts[2], incomingAmount: incAmt, isIncomingDone: isIncDone, memo: memo, fixedAllocation: fa, isSurplusDest: isSurplus }); }
                        else if (mode === '【手元現金】' && pts.length >= 3) { let outgo = '', isOutDone = false, isOutFixed = false, memoW = '', incAmtW = '', isIncDoneW = false, faW = ''; outgo = pts[3] || ''; isOutDone = pts[4]==='1'; isOutFixed = pts[5]==='1'; memoW = pts[6] || ''; if(pts.length >= 10) { incAmtW = pts[7]; isIncDoneW = pts[8]==='1'; faW = pts[9]; } nW.push({ id: Number(pts[0]), name: pts[1], amount: pts[2], outgoAmount: outgo, isOutgoDone: isOutDone, isOutgoFixed: isOutFixed, memo: memoW, incomingAmount: incAmtW, isIncomingDone: isIncDoneW, fixedAllocation: faW }); }
                        else if (mode === '【入金】' && pts.length >= 3) { let isFixedI = false, isDoneI = false, memoI = '', targetIdI = '', allocsI = []; if (pts.length === 4) { memoI = pts[3]; } else if (pts.length === 5) { isFixedI = pts[3] === '1'; memoI = pts[4]; } else if (pts.length === 6) { isFixedI = pts[3] === '1'; isDoneI = pts[4] === '1'; memoI = pts[5]; } else if (pts.length === 7) { isFixedI = pts[3] === '1'; isDoneI = pts[4] === '1'; memoI = pts[5]; targetIdI = pts[6]; } else if (pts.length >= 8) { isFixedI = pts[3] === '1'; isDoneI = pts[4] === '1'; memoI = pts[5]; targetIdI = pts[6]; if(pts[7]) { try { allocsI = JSON.parse(decodeURIComponent(escape(atob(pts[7])))); } catch(e){} } } nI.push({ id: Number(pts[0]), name: pts[1], amount: pts[2], isFixed: isFixedI, isDone: isDoneI, memo: memoI, targetId: targetIdI, autoAllocations: allocsI }); }
                        else if (mode === '【支払い】') { if (line.startsWith('>') && currP && pts.length >= 4) { let cat = 'variable', endDate = '', memo = ''; if (pts.length === 6) { cat = (pts[3] === '1' || pts[3] === '0') ? (pts[3]==='1'?'fixed':'variable') : pts[3]; endDate = pts[4]; memo = pts[5]; } else if (pts.length >= 7) { cat = (pts[3] === '1' || pts[3] === '0') ? (pts[3]==='1'?'fixed':'variable') : pts[3]; endDate = pts[4]; memo = pts.slice(5).join(','); } currP.subItems.push({ id: Number(pts[0].substring(1)), name: pts[1], amount: pts[2], category: cat, endDate: endDate, memo: memo }); } else if (pts.length >= 3) { let dueDate = pts[3] ? Number(pts[3]) : null, accountId = pts[4] ? Number(pts[4]) : '', cat = 'variable', isDone = false, memo = '', endDate = ''; if (pts.length === 6) { memo = pts[5]; } else if (pts.length === 7) { cat = pts[5] === '1' ? 'fixed' : 'variable'; memo = pts[6]; } else if (pts.length >= 8) { cat = (pts[5] === '1' || pts[5] === '0') ? (pts[5]==='1'?'fixed':'variable') : pts[5]; isDone = pts[6] === '1'; memo = pts[7]; } if (pts.length >= 9) { endDate = pts[8]; memo = pts.slice(7, -1).join(','); } else { memo = pts.slice(7).join(','); } currP = { id: Number(pts[0]), name: pts[1], amount: pts[2], dueDate: dueDate, endDate: endDate, accountId: accountId, category: cat, isDone: isDone, memo: memo, subItems: [] }; nP.push(currP); } }
                        else if (mode === '【特別支出】' && pts.length >= 3) { nSP.push({ id: Number(pts[0]), name: pts[1], amount: pts[2], targetMonth: pts[3]||'', isDone: pts[4]==='1', memo: pts.slice(5).join(',') }); }
                        else if (mode === '【メモ】' && pts.length >= 3) { nM.push({ id: Number(pts[0]), title: pts[1], targetDate: pts[2]||'', content: pts.slice(3).join(',') }); }
                        else if (mode === '【履歴】' && pts.length >= 4) { let catTotals = null, details = null, income = 0, incomeDetails = null; if (pts.length >= 8) { catTotals = { loan: Number(pts[4])||0, fixed: Number(pts[5])||0, variable: Number(pts[6])||0, investment: Number(pts[7])||0 }; if (catTotals.loan === 0 && catTotals.fixed === 0 && catTotals.variable === 0 && catTotals.investment === 0) catTotals = null; } if (pts.length >= 9 && pts[8]) { try { details = JSON.parse(decodeURIComponent(escape(atob(pts[8])))); } catch(e) {} } if (pts.length >= 10 && pts[9]) { income = Number(pts[9]) || 0; } if (pts.length >= 11 && pts[10]) { try { incomeDetails = JSON.parse(decodeURIComponent(escape(atob(pts[10])))); } catch(e) {} } nH.push({ id: pts[0], label: pts[1], payment: Number(pts[2]), balance: Number(pts[3]), catTotals, details, income, incomeDetails }); }
                    }
                    App.state.confirmImportData = { accounts: nA, wallets: nW, incomes: nI, payments: nP, history: nH, specialPayments: nSP, memos: nM }; App.state.importMsg = { text: '', isError: false }; App.render();
                } catch (e) { App.state.importMsg = { text: 'データの解析に失敗しました。ファイルが正しくない可能性があります。', isError: true }; App.render(); }
            },
            executeImport: function() {

                App.state.accounts = data.accounts; App.state.wallets = data.wallets; App.state.incomes = data.incomes; App.state.payments = data.payments; App.state.history = data.history; App.state.specialPayments = data.specialPayments || []; App.state.memos = data.memos || [];

                                <form onsubmit="App.saveAllocationEdit(event)">
                                    <div class="p-5 space-y-4">
                                        <p class="text-xs text-gray-600">この入金からの振り分け額を変更します。変更分は対象の「口座・現金」の入金予定額にも自動で加減算されます。</p>
                                        <div>
                                            <label class="text-xs font-bold text-gray-500 mb-1 block">振込先</label>
                                            <input type="text" value="${escapeHTML(modal.name)}" class="w-full px-3 py-2 text-sm border rounded-lg bg-gray-50 text-gray-500 font-bold" readonly />
                                        </div>
                                        <div>
                                            <label class="text-xs font-bold text-gray-500 mb-1 block">割り振り金額 (円)</label>
                                            <input type="number" id="edit-alloc-amount" value="${modal.amount}" class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-300 font-bold text-indigo-900" required />
                                        </div>
                                    </div>
                                    <div class="p-5 border-t bg-gray-50 rounded-b-2xl flex justify-between gap-3">
                                        <button type="button" onclick="App.deleteAllocation()" class="px-4 py-2 bg-white border border-red-200 text-red-500 font-bold rounded-lg hover:bg-red-50 text-xs transition-colors shadow-sm whitespace-nowrap">この指示を削除</button>
                                        <button type="submit" class="flex-1 py-2 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 text-sm shadow-sm transition-colors">変更を保存</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    `;
                }

                if (s.selectedAccountPopup !== null) {
                    const acc = s.accounts.find(a => a.id === s.selectedAccountPopup);
                    if (acc) {
                        const relPays = s.payments.filter(p => p.accountId === acc.id); const totalOut = relPays.filter(p => !p.isDone).reduce((sum, p) => sum + App.calcAmount(p.amount), 0); const expected = App.calcAmount(acc.amount) + (acc.isIncomingDone ? 0 : App.calcAmount(acc.incomingAmount)) - totalOut;
                        html += `<div class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fade-in" onclick="App.closeModal('selectedAccountPopup')"><div class="bg-white rounded-2xl w-full max-w-md shadow-2xl flex flex-col max-h-[85vh] animate-zoom-in" onclick="event.stopPropagation()"><div class="p-5 border-b border-gray-100 flex justify-between items-center bg-blue-50/50 rounded-t-2xl"><div><h3 class="text-xl font-bold text-gray-800">${escapeHTML(acc.name)}</h3><p class="text-sm text-gray-500 font-medium mt-1">現在残高: <span class="font-bold text-gray-800">${App.formatCurrency(acc.amount)}</span></p></div><button onclick="App.closeModal('selectedAccountPopup')" class="p-2 text-gray-400 hover:bg-white rounded-full bg-gray-50">${App.getIconHTML('x', 24)}</button></div><div class="p-5 overflow-y-auto"><h4 class="text-sm font-bold text-gray-700 mb-3 flex items-center gap-2">${App.getIconHTML('arrow-up-from-line', 20, 'text-rose-500')} 引落予定の明細一覧</h4>`;
                        if (relPays.length > 0) { html += `<div class="space-y-2">`; relPays.forEach(p => { html += `<div class="flex justify-between items-center bg-white p-3 rounded-xl border border-gray-100 text-sm shadow-sm ${p.isDone ? 'opacity-40 bg-gray-50' : ''}"><div><span class="font-bold block mb-1 ${p.isDone?'line-through':''}">${escapeHTML(p.name)}</span><div class="flex gap-2 text-[10px]">${p.dueDate ? `<span class="bg-gray-50 border px-1.5 py-0.5 rounded text-gray-500 flex items-center gap-1">${App.getIconHTML('calendar', 12)}${p.dueDate}日引落</span>` : ''}${p.isDone ? `<span class="bg-rose-100 text-rose-700 font-bold px-1.5 py-0.5 rounded">済</span>` : ''}</div></div>${App.getDisplayAmountHTML(p.amount, "text-gray-800")}</div>`; }); html += `</div>`; } 
                        else { html += `<p class="py-8 text-center text-sm text-gray-500 border border-dashed rounded-xl">引落予定はありません</p>`; }
                        html += `</div><div class="p-5 border-t bg-gray-50 rounded-b-2xl"><div class="flex justify-between text-sm font-bold mb-2"><span class="text-gray-600">未済引落合計</span><span class="text-rose-600">-${App.formatCurrency(totalOut)}</span></div><div class="flex justify-between pt-3 border-t border-gray-200"><span class="text-sm font-bold text-gray-600">引落後予想残高</span><span class="font-black text-xl ${expected < 0 ? 'text-red-600' : 'text-emerald-600'}">${App.formatCurrency(expected)}</span></div></div></div></div>`;
                    }
                }
                return html;
            },

            init: function() {
                App.loadData();
                const currentMonth = App.getCurrentMonthStr();
                const lastOpenedMonth = localStorage.getItem(STORAGE_KEY + 'last_opened_month');
                if (lastOpenedMonth && lastOpenedMonth !== currentMonth) {
                    App.calculateTotals(); const existingHistory = App.state.history;
                    if (!existingHistory.some(h => h.id === lastOpenedMonth)) {
                        const [y, m] = lastOpenedMonth.split('-');
                        existingHistory.push({ id: lastOpenedMonth, label: `${y.slice(2)}年${parseInt(m, 10)}月`, payment: App.totals.totalPaymentsNum, balance: App.totals.calculatedEndBalance, income: App.totals.totalIncomesList, catTotals: App.totals.allCatTotals, details: App.createHistoryDetails(), incomeDetails: App.createIncomeDetails() });
                        existingHistory.sort((a, b) => a.id.localeCompare(b.id)); App.state.showAutoSaveModal = true;
                    }
                    App.executeMonthlyReset(); App.saveData();
                }
                localStorage.setItem(STORAGE_KEY + 'last_opened_month', currentMonth);
                App.render();
            }
        };

        window.App = App;
        document.addEventListener('DOMContentLoaded', () => { App.init(); });
    </script>
</body>
</html>
